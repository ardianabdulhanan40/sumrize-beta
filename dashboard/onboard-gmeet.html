    <script>

        const apiOrigin = 'http://localhost/sumrize-beta';
        const apiBase = `${apiOrigin}/api/connectors/google`;
        const token = localStorage.getItem('sumrize_auth_token');
        const connectButton = document.getElementById('connect-button');
        const connectLabel = document.getElementById('connect-label');
        const disconnectButton = document.getElementById('disconnect-button');
        const statusElement = document.getElementById('connection-status');
        const accountElement = document.getElementById('connected-account');

        function authHeaders() {
            return token
                ? { Authorization: `Bearer ${token}` }
                : {};
        }

        async function readJsonResponse(response) {
            const raw = await response.text();

            if (!raw.trim()) {
                throw new Error(
                    `Server mengembalikan response kosong (HTTP ${response.status}).`
                );
            }

            try {
                return JSON.parse(raw);
            } catch (error) {
                console.error(
                    '[Sumrize] Invalid API response:',
                    raw.slice(0, 500)
                );
                throw new Error(
                    `Response server bukan JSON (HTTP ${response.status}).`
                );
            }
        }

        function setConnectionStatus(message, connected = false) {
            statusElement.textContent = message;
            statusElement.className = connected
                ? 'mt-4 text-sm font-semibold text-success-600 dark:text-success-500'
                : 'mt-4 text-sm font-semibold text-gray-500 dark:text-gray-400';
        }

        async function loadConnectionStatus() {
            const googleConnected =
                new URLSearchParams(window.location.search)
                    .get('google_connected') === '1';

            const oauthError = new URLSearchParams(
                window.location.search
            ).get('code');

            const oauthMessage = new URLSearchParams(
                window.location.search
            ).get('message');

            if (new URLSearchParams(window.location.search).get('google_oauth') === 'error') {
                const messages = {
                    access_denied: 'Izin Google ditolak.',
                    invalid_state: 'Sesi OAuth tidak valid. Silakan coba lagi.',
                    state_expired: 'Sesi OAuth kedaluwarsa. Silakan coba lagi.',
                    invalid_grant: 'Authorization code tidak valid, kedaluwarsa, atau sudah digunakan.',
                    invalid_client: 'Konfigurasi OAuth Google tidak valid.',
                    redirect_uri_mismatch: 'Redirect URI Google tidak cocok dengan konfigurasi OAuth.',
                    refresh_token_missing: 'Refresh token tidak tersedia. Silakan hubungkan ulang Google Meet.',
                    connection_verification_failed: 'Koneksi tidak ditemukan setelah disimpan.',
                    token_exchange_failed: 'Google gagal menyelesaikan koneksi.'
                };

                setConnectionStatus(
                    messages[oauthError] ||
                    oauthMessage ||
                    'Koneksi Google gagal.'
                );

                connectButton.classList.remove('hidden');
                connectButton.disabled = false;
                connectLabel.textContent = 'Coba Hubungkan Lagi';
            }

            if (!token) {
                setConnectionStatus('Login Sumrize diperlukan.');
                return;
            }

            try {
                const response = await fetch(`${apiBase}/status.php`, {
                    headers: authHeaders(),
                    credentials: 'include'
                });
                const payload = await readJsonResponse(response);
                const data = payload?.data;

                if (!response.ok || payload?.ok !== true) {
                    throw new Error(payload?.error?.message || 'Status gagal dimuat.');
                }

                if (data.connected) {
                    setConnectionStatus('✓ Google Meet berhasil terhubung', true);
                    accountElement.textContent = data.account?.email
                        ? `Akun: ${data.account.email}`
                        : '';
                    connectButton.classList.add('hidden');
                    disconnectButton.classList.remove('hidden');
                } else {
                    setConnectionStatus(
                        googleConnected
                            ? 'Koneksi Google belum tersimpan.'
                            : 'Google Meet belum terhubung.'
                    );
                    accountElement.textContent = '';
                    connectLabel.textContent = 'Hubungkan Google Meet';
                }
            } catch (error) {
                setConnectionStatus(error.message);
            }
        }

        async function connectGoogleMeet() {
            connectButton.disabled = true;
            setConnectionStatus('Membuka autentikasi Google...');

            window.location.assign(`${apiBase}/connect.php`);
        }

        async function disconnectGoogleMeet() {
            disconnectButton.disabled = true;

            try {
                const response = await fetch(`${apiBase}/disconnect.php`, {
                    method: 'POST',
                    headers: authHeaders(),
                    credentials: 'include'
                });
                const payload = await readJsonResponse(response);

                if (!response.ok || payload?.ok !== true) {
                    throw new Error(payload?.error?.message || 'Disconnect gagal.');
                }

                connectButton.classList.remove('hidden');
                disconnectButton.classList.add('hidden');
                setConnectionStatus('Google Meet belum terhubung.');
                accountElement.textContent = '';
            } catch (error) {
                setConnectionStatus(error.message);
            } finally {
                disconnectButton.disabled = false;
            }
        }

        connectButton.addEventListener('click', connectGoogleMeet);
        disconnectButton.addEventListener('click', disconnectGoogleMeet);


        document.addEventListener(
            'DOMContentLoaded',
            () => {

                lucide.createIcons();
                loadConnectionStatus();

            }
        );

        document.addEventListener(
            'alpine:initialized',
            () => {

                lucide.createIcons();

            }
        );

    </script>
