    /* UPGRADE BUTTON WITH ANIMATED RAINBOW CONIC BORDER */
    .dashboard-navbar-v3-item.is-upgrade-action {
        --upgrade-fill-start: #1c202d;
        --upgrade-fill-end: #141722;
        width: calc(100% - 20px) !important;
        margin: 10px 10px !important;
        position: relative !important;
        isolation: isolate !important;
        overflow: hidden !important;
        border: 0 !important;
        border-radius: 14px !important;
        background: transparent !important;
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 16px !important;
        min-height: 44px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 10px !important;
        text-decoration: none !important;
        animation: sumrizeUpgradeGlow 3s ease-in-out infinite !important;
        padding: 0 16px !important;
        box-sizing: border-box !important;
    }

    .dashboard-navbar-v3-item.is-upgrade-action::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 180%;
        aspect-ratio: 1;
        z-index: 0;
        background: conic-gradient(from 0deg, #ff4d64, #ffb84c, #5fe277, #45c8ff, #9a7cff, #ff62bd, #ff4d64);
        transform: translate(-50%, -50%) rotate(0deg);
        filter: saturate(1.3) brightness(1.15);
        pointer-events: none;
        will-change: transform;
        animation: sumrizeUpgradeBorderFlow 3s linear infinite;
    }

    .dashboard-navbar-v3-item.is-upgrade-action::after {
        content: "";
        position: absolute;
        inset: 2px;
        z-index: 1;
        border-radius: calc(14px - 2px);
        background: linear-gradient(180deg, var(--upgrade-fill-start), var(--upgrade-fill-end));
        pointer-events: none;
    }

    .dashboard-navbar-v3-item.is-upgrade-action>* {
        position: relative;
        z-index: 2;
    }

    .dashboard-navbar-v3-item.is-upgrade-action i {

    @keyframes sumrizeUpgradeBorderFlow {

<!-- SCRIPT LOGIKA GLOBAL -->
<script>
    // Event listener universal untuk menutup dropdown saat klik di luar
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.dashboard-navbar-v3-dropdown-wrap')) {
            document.querySelectorAll('.dashboard-navbar-v3-dropdown').forEach(d => {
                d.classList.remove('is-open');
                d.setAttribute('aria-hidden', 'true');
            });
            document.querySelectorAll('.toggle-dashboard-navbar-v3-dropdown').forEach(b => {
                b.setAttribute('aria-expanded', 'false');
            });
        }
    });

    // Fungsi Buka / Tutup Drawer Mobile
    function openMobileDrawer() {
        const drawer = document.getElementById('mobileDashboardDrawerV3');
        const overlay = document.getElementById('mobileDrawerOverlay');
        const icon = document.getElementById('mobileMenuIcon');
        if (drawer) drawer.classList.add('is-open');
        if (overlay) overlay.classList.add('is-open');
        if (icon) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-xmark');
        }
        document.body.style.overflow = 'hidden';
    }

    function closeMobileDrawer() {
        const drawer = document.getElementById('mobileDashboardDrawerV3');
        const overlay = document.getElementById('mobileDrawerOverlay');
        const icon = document.getElementById('mobileMenuIcon');
        if (drawer) drawer.classList.remove('is-open');
        if (overlay) overlay.classList.remove('is-open');
        if (icon) {
            icon.classList.remove('fa-xmark');
            icon.classList.add('fa-bars');
        }
        document.body.style.overflow = '';
    }

    function toggleMobileDrawer() {
        const drawer = document.getElementById('mobileDashboardDrawerV3');
        if (drawer && drawer.classList.contains('is-open')) {
            closeMobileDrawer();
        } else {
            openMobileDrawer();
        }
    }

    // Ekspor fungsi ke window agar dapat dipanggil dari mana saja
    window.openMobileDrawer = openMobileDrawer;
    window.closeMobileDrawer = closeMobileDrawer;
    window.toggleMobileDrawer = toggleMobileDrawer;
    window.initMobileMenu = function () {
        const btn = document.getElementById('mobileMenuBtn');
        const overlay = document.getElementById('mobileDrawerOverlay');
        if (btn) {
            btn.onclick = function (e) {
                e.preventDefault();
                toggleMobileDrawer();
            };
        }
        if (overlay) {
            overlay.onclick = function (e) {
                e.preventDefault();
                closeMobileDrawer();
            };
        }
    };

    // Keyboard accessibility: ESC menutup drawer
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeMobileDrawer();
            const mobMenu = document.getElementById('dashboardUserDropdownMobile');
            if (mobMenu) mobMenu.classList.remove('is-open');
        }
    });

    function initSidebarState() {
        // ==========================================
        // 1. LOGIK UNTUK MENU AKTIF (ACTIVE STATE)
        // ==========================================
        let currentPath = window.location.pathname.split("/").pop();
        if (currentPath === "") currentPath = "index.html";

        const sidebarLinks = document.querySelectorAll('.dashboard-sidebar-link-v3');

        sidebarLinks.forEach(link => {
            link.classList.remove('is-active');
            const linkHref = link.getAttribute('href');
            if (linkHref) {
                const cleanHref = linkHref.startsWith('/') ? linkHref.substring(1) : linkHref;
                if (cleanHref === currentPath) {
                    link.classList.add('is-active');
                }
            }
        });

        // ==========================================
        // 2. LOGIK UNTUK SETTING TOMBOL TEMA
        // ==========================================
        let savedTheme = localStorage.getItem('sumrize_v2_theme') || 'dark';
        updateThemeButtons(savedTheme);

        // Pasang listener drawer mobile jika ada
        window.initMobileMenu();
        if (typeof updateUserPlanUI === 'function') updateUserPlanUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener("DOMContentLoaded", initSidebarState);
    } else {
        initSidebarState();
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-v2-theme', theme);
        localStorage.setItem('sumrize_v2_theme', theme);
        updateThemeButtons(theme);
    }

    function updateThemeButtons(theme) {
        const btnDark = document.getElementById('btnThemeDark');
        const btnLight = document.getElementById('btnThemeLight');
        const btnDarkMob = document.getElementById('btnThemeDarkMobile');
        const btnLightMob = document.getElementById('btnThemeLightMobile');

        // Sinkronisasi tombol desktop
        if (btnDark && btnLight) {
            if (theme === 'dark') {
                btnDark.classList.add('is-active');
                btnLight.classList.remove('is-active');
            } else {
                btnLight.classList.add('is-active');
                btnDark.classList.remove('is-active');
            }
        }

        // Sinkronisasi tombol mobile drawer
        if (btnDarkMob && btnLightMob) {
            if (theme === 'dark') {
                btnDarkMob.classList.add('is-active');
                btnLightMob.classList.remove('is-active');
            } else {
                btnLightMob.classList.add('is-active');
                btnDarkMob.classList.remove('is-active');
            }
        }

        // Sinkronisasi Logo
        const desktopLogo = document.getElementById('themeLogoDesktop');
        const mobileLogo = document.getElementById('themeLogoMobile');
        const drawerLogo = document.getElementById('themeLogoMobileDrawer');
        const logoSrc = (theme === 'dark')
            ? 'https://app.sumrize.me/assets/img/logo/logo-white.png'
            : 'https://app.sumrize.me/assets/img/logo/logo-black.png';

        if (desktopLogo) desktopLogo.src = logoSrc;
        if (mobileLogo) mobileLogo.src = logoSrc;
        if (drawerLogo) drawerLogo.src = logoSrc;
    }

    // ==========================================
    // 3. LOGIK STATUS PLAN (EXPLORE / SPARK)
    // ==========================================
    let currentUserPlan = localStorage.getItem('sumrize_user_plan') || 'explore';

    function updateUserPlanUI() {
        // Update label plan di Navbar
        const planLabels = document.querySelectorAll('.user-plan-label');
        planLabels.forEach(label => {
            label.innerText = currentUserPlan.toUpperCase();
        });

        // Logika menyembunyikan atau memunculkan ikon gembok "Spark"
        const sparkLinks = document.querySelectorAll('a[data-requires="spark"]');
        sparkLinks.forEach(link => {
            const lockBadge = link.querySelector('.lock-badge');
            if (currentUserPlan === 'spark') {
                if (lockBadge) lockBadge.style.display = 'none';
            } else {
                if (lockBadge) lockBadge.style.display = 'inline-flex';
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateUserPlanUI();

        // Pencegahan klik jika status bukan 'spark'
        const restrictedLinks = document.querySelectorAll('a[data-requires="spark"]');
        restrictedLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                if (currentUserPlan !== 'spark') {
                    e.preventDefault();
                    alert('Menu ini khusus untuk paket Spark. Silakan upgrade ke Spark untuk menggunakan Automation.');
                }
            });
        });
    });

    // Fungsi trigger click tulisan EXPLORE untuk simulasi perubahan status
    function toggleUserPlan() {
        currentUserPlan = currentUserPlan === 'explore' ? 'spark' : 'explore';
        localStorage.setItem('sumrize_user_plan', currentUserPlan);
        updateUserPlanUI();
        alert('Simulasi: Status user diubah menjadi ' + currentUserPlan.toUpperCase());
    }
</script>
