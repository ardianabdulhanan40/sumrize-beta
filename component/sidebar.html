         0% {

         }

         37.5% {
             transform: rotate(360deg);
         }

         62.5% {
             transform: rotate(360deg);
         }

         100% {
             transform: rotate(720deg);
         }
     }

         0% {
             transform: scale(1);
         }

         15% {
             transform: scale(1.08);
             /* Detak pertama: membesar sedikit */
         }

         30% {
             transform: scale(1);
             /* Kembali normal */
         }

         45% {
             transform: scale(1.08);
             /* Detak kedua: membesar sedikit lagi */
         }

         60% {
             transform: scale(1);
             /* Kembali normal */
         }

         100% {
             transform: scale(1);
             /* Jeda sebelum mengulang animasi */
         }
     }

     .toggle-switch {
         position: relative;
         display: inline-block;
         width: 48px;
         height: 28px;
     }

     .toggle-switch input {
         opacity: 0;
         width: 0;
         height: 0;
     }

     .toggle-switch .slider {
         position: absolute;
         cursor: pointer;
         top: 0;
         left: 0;
         right: 0;
         bottom: 0;
         background-color: #ccc;
         transition: 0.4s;
         border-radius: 34px;
     }

     .toggle-switch .slider:before {
         position: absolute;
         content: "";
         height: 22px;
         width: 22px;
         left: 3px;
         top: 3px;
         background-color: white;
         transition: 0.4s;
         border-radius: 50%;
     }

     span.block {

         padding: 2px 8px;
         border-radius: 4px;
         background: black;

     }

     .toggle-switch input:checked+.slider {
         background-color: #4eac6d;
     }

     .toggle-switch input:checked+.slider:before {
         transform: translateX(20px);
     }

     /* Optional: add focus style */
     .toggle-switch input:focus+.slider {
         box-shadow: 0 0 1px #4eac6d;
     }

         background: rgba(0, 0, 0, 0.8);

         z-index: 9998;

     .ask-rizz-modal-wrap {
         position: fixed;
         left: 50%;
         bottom: 0;
         transform: translateX(-50%);
         width: 100%;
         max-width: 480px;
         max-height: 80vh;
         height: 80vh;

     @keyframes ask-rizz-slide-up {
         from {
             transform: translateX(-50%) translateY(100%);
         }

         to {
             transform: translateX(-50%) translateY(0);
         }
     }

     @keyframes ask-rizz-slide-down {
         from {
             transform: translateX(-50%) translateY(0);
         }

         to {
             transform: translateX(-50%) translateY(100%);
         }
     }

     /* Tombol Ask Rizz — lingkaran gradient ungu -> magenta.
