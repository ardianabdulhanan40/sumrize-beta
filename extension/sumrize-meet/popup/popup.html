<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <title>
        Sumrize Meeting Assistant
    </title>

    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            padding: 16px;
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h2>Sumrize Meeting</h2>

    <button id="start">
        Start Capture
    </button>

    <button id="stop">
        Stop Capture
    </button>

    <button id="view">
        View Captured
    </button>

    <div id="status">
        Status: Ready
    </div>

    <script src="popup.js"></script>

</body>

</html>
